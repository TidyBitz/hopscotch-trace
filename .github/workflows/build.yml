name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (core + UI)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Core unit tests
        run: cargo test -p hopscotch-core
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: UI smoke tests (demo mode and live mode with a fake backend)
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node tests/smoke.js
          node tests/live.js

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            rust_target: ''
          - name: macOS
            os: macos-latest
            bundles: app,dmg
            rust_target: universal-apple-darwin
          - name: Linux
            os: ubuntu-24.04
            bundles: appimage,deb
            rust_target: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Install the Tauri CLI
        run: npm install
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            npx tauri build --bundles ${{ matrix.bundles }} --target ${{ matrix.rust_target }}
          else
            npx tauri build --bundles ${{ matrix.bundles }}
          fi
      - name: Repack the AppImage without host-provided graphics libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cd target/release/bundle/appimage
          img=$(ls *.AppImage)
          chmod +x "$img"
          ./"$img" --appimage-extract > /dev/null
          # linuxdeploy copies these in, but they sit underneath the host's Mesa/EGL
          # driver, which needs the host's own versions: with the bundled ones first on
          # LD_LIBRARY_PATH, eglGetPlatformDisplay fails (EGL_BAD_PARAMETER) on Fedora.
          find squashfs-root \( -name 'libwayland-*.so*' -o -name 'libxkbcommon*.so*' -o -name 'libxcb*.so*' \) -print -delete
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          rm -f "$img"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$img"
          rm -rf squashfs-root appimagetool
          ls -la
      - name: Collect portable and installer files
        shell: bash
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            Windows)
              cp target/release/hopscotch-trace.exe "out/Hopscotch-portable-windows-x64.exe"
              cp target/release/bundle/nsis/*.exe out/ 2>/dev/null || true
              ;;
            macOS)
              (cd target/universal-apple-darwin/release/bundle/macos && ditto -c -k --keepParent Hopscotch.app "$GITHUB_WORKSPACE/out/Hopscotch-macos-universal.app.zip")
              cp target/universal-apple-darwin/release/bundle/dmg/*.dmg out/ 2>/dev/null || true
              ;;
            Linux)
              cp target/release/bundle/appimage/*.AppImage "out/Hopscotch-linux-x86_64.AppImage"
              cp target/release/bundle/deb/*.deb out/ 2>/dev/null || true
              ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: hopscotch-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Attach builds to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/**/*
